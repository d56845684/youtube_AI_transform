server {
    listen 80;
    server_name localhost;

    # Serve the compiled/static frontend assets
    root /usr/share/nginx/html;
    index index.html;

    # Basic health check to verify Nginx is reachable
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Only allow valid asset paths and surface 404s clearly
    location / {
        try_files $uri $uri/ =404;
    }
}
